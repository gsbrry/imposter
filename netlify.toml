# Build configuration for the Impostr web build.
# Keeping this in the repo means the Netlify UI does not need any
# settings filled in by hand, and the build cannot drift from the code.

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  # Expo SDK 54 and React Native 0.81 need a current Node.
  NODE_VERSION = "20"

# Expo Router exports a single-page app, so unknown paths must fall back
# to index.html. Real files such as privacy-policy.html are served first,
# because this rule only applies when nothing else matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
